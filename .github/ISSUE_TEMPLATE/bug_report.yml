name: Bug report
description: Something in SwiftRouter does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A deep link that gets past the documented checks, or a screen shown without its guard, is a security issue: report it privately (see SECURITY.md), not here.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: The navigation calls, deep link or taps, the screens you expected and the screens you got.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Code that shows it
      description: A small route enum and view, or the URL and the DeepLinks patterns.
      render: swift
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SwiftRouter version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: "iOS 27.0 simulator"
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: "27.1"
    validations:
      required: true
