# XcodeGen spec for RouterDemo.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: RouterDemo
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  SwiftRouter:
    path: ../..
targets:
  RouterDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [RouterDemo]
    dependencies:
      - package: SwiftRouter
        product: SwiftRouter
    info:
      path: RouterDemo/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.github.muhittincamdali.RouterDemo
            CFBundleURLSchemes: [routerdemo]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Router Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulator needs no signing.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  RouterDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RouterDemoUITests]
    dependencies:
      - target: RouterDemo
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RouterDemo
        CODE_SIGN_STYLE: Automatic
schemes:
  RouterDemo:
    build:
      targets:
        RouterDemo: all
    run:
      config: Debug
    test:
      targets:
        - RouterDemoUITests
